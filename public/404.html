<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Мечты и Судьбы</title>
    <script>
      // GitHub Pages serves this project from a subpath; REG.RU serves it from the domain root.
      var pathSegmentsToKeep = location.hostname.endsWith('github.io') ? 1 : 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
