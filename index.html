    <!-- Preload only the first-screen photo for the current route. -->
    <script>
      (function () {
        var base = '%BASE_URL%';
        var route = location.pathname.slice(base.length).replace(/\/$/, '');
        var photos = {
          '': ['hero/hero-embrace', [480, 720, 1024, 1280], '(max-width: 900px) calc(100vw - 32px), 510px'],
          'domiki': ['cabins/domiki-evening-exterior', [480, 720, 1280, 1600], '(max-width: 760px) calc(100vw - 32px), (max-width: 1100px) 80vw, 620px'],
          'svyaz': ['svyaz/group', [480, 720, 1280], '(max-width: 760px) calc(100vw - 32px), 620px'],
          'training': ['training/group', [480, 720, 1244], '(max-width: 760px) calc(100vw - 32px), 620px']
        };
        var photo = photos[route];
        if (!photo) return;
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.type = 'image/webp';
        link.fetchPriority = 'high';
        var imageUrl = function (width) {
          var fullSize = width === 1600 || width === 1244 || (width === 1280 && route === 'svyaz');
          return base + photo[0] + (fullSize ? '' : '-' + width) + '.webp';
        };
        link.setAttribute('imagesrcset', photo[1].map(function (width) {
          return imageUrl(width) + ' ' + width + 'w';
        }).join(', '));
        link.href = imageUrl(photo[1].at(-1));
        link.imageSizes = photo[2];
        document.head.appendChild(link);
      }());
    </script>

    <!-- SPA redirect restore (works with 404.html) -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
